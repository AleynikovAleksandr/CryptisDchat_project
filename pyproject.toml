[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptisdchat"
version = "0.1.0"
description = "End-to-end encrypted messenger with a delivery log anchored on the TON blockchain"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Aleynikov Aleksandr", email = "aleynikov.aleksandr@icloud.com" },
    { name = "Skripka Artyom Aleksandrovich" },
]
# Те же версии, что в backend/requirements.txt — по нему собираются Docker-образы backend и worker.
# tests/test_dependencies.py следит, чтобы списки не разошлись.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "gunicorn==26.2.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "SQLAlchemy[asyncio]==2.1.0",
    "asyncmy==0.2.15",
    "PyMySQL==1.2.3",
    "redis==6.4.0",
    "celery[redis]==5.6.3",
    "PyJWT==2.15.0",
    "cryptography==50.0.1",
    "PyNaCl==1.6.2",
    "tonsdk==1.0.15",
    "httpx==0.28.1",
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.3.0",
    "WTForms==3.2.2",
]

[project.optional-dependencies]
# тесты и локальный запуск без Docker (scripts/dev_server.py, браузерные E2E) — как в requirements.txt
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aiosqlite==0.22.1",
    "fakeredis==2.38.0",
    "grpcio-tools==1.84.0",
    "redislite==6.2.912183",
    "lupa==2.8",
    "playwright==1.63.0",
]

[project.urls]
Documentation = "https://drive.google.com/drive/folders/1jvNFLmGvsCVsGoeSogor_gkPvS4btj1P?usp=sharing"

# Это приложение, а не библиотека: код запускается из backend/, worker/ и realm/ (Docker-образы,
# scripts/dev_server.py), поэтому `pip install -e ".[dev]"` ставит только зависимости.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
